<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TUG Lista - Master Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        .bg-excel-done { background-color: #00ff00 !important; color: black !important; font-weight: 900; }
        
        /* Rad-färger baserat på status */
        .row-prio { background-color: #fef08a !important; border-left: 12px solid #facc15 !important; }
        .row-problem { background-color: #fee2e2 !important; border-left: 12px solid #f87171 !important; }
        
        /* Info-badges */
        .badge-in { background-color: #3b82f6; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; }
        .badge-ut { background-color: #10b981; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; }
        .badge-fixa { background-color: #f59e0b; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; }

        .tab-active { background-color: white !important; border-top: 4px solid #3b82f6 !important; color: #1e40af !important; font-weight: 900 !important; }
        .edit-input { background: transparent; border: none; outline: none; width: 100%; font-weight: 900; text-transform: uppercase; }
        
        .drag-handle { cursor: grab; color: #cbd5e1; display: flex; align-items: center; padding: 0 10px; }
        .sortable-ghost { opacity: 0.3; background: #dbeafe; }

        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e293b; z-index: 9999; display: flex; align-items: center; justify-content: center;
        }

        #undoToast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: none; animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-32 font-sans text-slate-700">

    <div id="undoToast" class="bg-slate-800 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 border border-slate-600">
        <span class="font-bold text-sm">Uppdrag klart!</span>
        <button id="undoBtn" class="bg-blue-600 px-4 py-1 rounded-lg font-black text-xs uppercase italic">Ångra ↺</button>
    </div>

    <div id="loginOverlay">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-80 text-center border-t-8 border-blue-600">
            <h2 class="text-2xl font-black mb-6 uppercase italic text-slate-800">🚛 Tug Lista</h2>
            <input id="passInput" type="password" placeholder="Lösenord" class="w-full border-2 p-4 rounded-xl mb-4 text-center text-xl font-bold border-slate-200 outline-none focus:border-blue-500">
            <button onclick="checkLogin()" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase shadow-lg">Logga in</button>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <div class="max-w-6xl mx-auto px-2 pt-4">
            <div class="flex justify-between items-center mb-6 px-2">
                <h1 class="text-2xl font-black text-slate-800 italic uppercase">🚛 Tug Lista</h1>
                <button onclick="logout()" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Logga ut</button>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6">
                <div class="grid grid-cols-2 gap-3 sm:grid-cols-5 items-end">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase text-center sm:text-left">Trailer</label>
                        <input id="trailerNr" type="text" class="w-full border border-slate-300 p-3 rounded-xl font-bold outline-none focus:border-blue-500 uppercase text-center sm:text-left">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase text-center sm:text-left">Port</label>
                        <input id="portNr" type="text" class="w-full border border-slate-300 p-3 rounded-xl font-bold outline-none focus:border-blue-500 text-center sm:text-left">
                    </div>
                    <div class="hidden sm:block">
                        <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase">Avd</label>
                        <select id="deptSelect" class="w-full border border-slate-300 p-3 rounded-xl font-bold bg-white">
                            <option>Imp</option><option>Exp</option><option>Secu</option><option>Mattor</option><option>Xylem</option><option>Annat</option>
                        </select>
                    </div>
                    <div class="hidden sm:block">
                        <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase">Typ</label>
                        <select id="typSelect" class="w-full border border-slate-300 p-3 rounded-xl font-bold bg-white">
                            <option>In</option><option>Ut</option><option>Fixa</option>
                        </select>
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                       <button id="addBtn" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg uppercase text-xs active:scale-95">Skapa</button>
                    </div>
                </div>
            </div>

            <div id="dailyView">
                <div class="bg-[#1e293b] p-3 rounded-t-2xl flex justify-between items-center shadow-lg">
                    <h2 class="text-white text-xs font-black uppercase italic tracking-widest px-2">⚠️ <span id="currentTabLabel">Måndag</span></h2>
                    <span id="activeCount" class="bg-red-500 text-white text-[10px] px-3 py-1 rounded-full font-black italic">0 st</span>
                </div>
                <div class="bg-white rounded-b-2xl shadow-xl border border-slate-300 overflow-hidden mb-8">
                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse">
                            <thead class="bg-slate-50 border-b text-[10px] uppercase text-slate-400 font-bold">
                                <tr>
                                    <th class="p-3 w-8"></th>
                                    <th class="p-3 text-left">Trailer</th>
                                    <th class="p-3 text-left">Port</th>
                                    <th class="p-3 text-left">Info</th>
                                    <th class="p-3 text-left">Status / Notering</th>
                                    <th class="p-3 text-center">Åtgärd</th>
                                </tr>
                            </thead>
                            <tbody id="activeTable"></tbody>
                        </table>
                    </div>
                </div>

                <div id="doneList" class="space-y-2 px-2"></div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-300 flex z-50 shadow-2xl">
            <button onclick="switchTab('Måndag')" id="tab-Måndag" class="nav-tab flex-1 py-4 font-bold text-[10px] uppercase border-r text-slate-500">Mån</button>
            <button onclick="switchTab('Tisdag')" id="tab-Tisdag" class="nav-tab flex-1 py-4 font-bold text-[10px] uppercase border-r text-slate-500">Tis</button>
            <button onclick="switchTab('Onsdag')" id="tab-Onsdag" class="nav-tab flex-1 py-4 font-bold text-[10px] uppercase border-r text-slate-500">Ons</button>
            <button onclick="switchTab('Torsdag')" id="tab-Torsdag" class="nav-tab flex-1 py-4 font-bold text-[10px] uppercase border-r text-slate-500">Tor</button>
            <button onclick="switchTab('Fredag')" id="tab-Fredag" class="nav-tab flex-1 py-4 font-bold text-[10px] uppercase border-r text-slate-500">Fre</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCmVuLp-T9f_XGMmUnWZREK2gi8vvsiYb4",
            authDomain: "lagerlogistik-87feb.firebaseapp.com",
            databaseURL: "https://lagerlogistik-87feb-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lagerlogistik-87feb",
            storageBucket: "lagerlogistik-87feb.firebasestorage.app",
            messagingSenderId: "206906307140",
            appId: "1:206906307140:web:49acbdc1ab3445bc718211"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const trailersRef = ref(db, 'trailers');
        let allTrailers = {};
        let undoTimer = null;
        let lastFinishedId = null;

        window.checkLogin = () => {
            if(document.getElementById('passInput').value === "Tuglista") {
                localStorage.setItem('logistikLoginTime', Date.now());
                showApp();
            }
        };
        function showApp() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }
        window.logout = () => { localStorage.removeItem('logistikLoginTime'); location.reload(); };
        if (localStorage.getItem('logistikLoginTime')) showApp();

        window.currentDay = 'Måndag';
        window.switchTab = (tab) => {
            window.currentDay = tab;
            renderAll();
        };

        document.getElementById('addBtn').onclick = () => {
            const nr = document.getElementById('trailerNr').value.trim();
            const port = document.getElementById('portNr').value.trim();
            if (!nr) return;
            push(trailersRef, {
                nr, port, 
                typ: document.getElementById('typSelect').value,
                avd: document.getElementById('deptSelect').value,
                dag: window.currentDay, 
                status: "Normal", 
                notering: "",
                klar: false, 
                timestamp: Date.now(),
                order: Date.now()
            });
            document.getElementById('trailerNr').value = ""; document.getElementById('portNr').value = "";
        };

        window.updateVal = (id, field, val) => update(ref(db, `trailers/${id}`), { [field]: val });

        window.markDone = (id) => {
            update(ref(db, `trailers/${id}`), { 
                klar: true, 
                utford: new Date().toLocaleTimeString('sv-SE', {hour:'2-digit', minute:'2-digit'}) 
            });
            lastFinishedId = id;
            const toast = document.getElementById('undoToast');
            toast.style.display = 'flex';
            clearTimeout(undoTimer);
            undoTimer = setTimeout(() => toast.style.display = 'none', 5000);
        };

        document.getElementById('undoBtn').onclick = () => {
            if(lastFinishedId) {
                update(ref(db, `trailers/${lastFinishedId}`), { klar: false });
                document.getElementById('undoToast').style.display = 'none';
            }
        };

        window.deleteTrailer = (id) => {
            if(confirm("Radera uppdraget?")) remove(ref(db, `trailers/${id}`));
        };

        const el = document.getElementById('activeTable');
        Sortable.create(el, {
            handle: '.drag-handle',
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: function() {
                const rows = el.querySelectorAll('tr');
                rows.forEach((row, index) => {
                    const id = row.getAttribute('data-id');
                    update(ref(db, `trailers/${id}`), { order: index });
                });
            }
        });

        onValue(trailersRef, (snapshot) => { 
            allTrailers = snapshot.val() || {}; 
            renderAll(); 
        });

        function renderAll() {
            const activeTable = document.getElementById('activeTable');
            const doneList = document.getElementById('doneList');
            activeTable.innerHTML = ""; doneList.innerHTML = "";
            let aCount = 0;

            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('tab-active'));
            const activeTabBtn = document.getElementById('tab-' + window.currentDay);
            if(activeTabBtn) activeTabBtn.classList.add('tab-active');

            const sortedIds = Object.keys(allTrailers).sort((a,b) => {
                const tA = allTrailers[a];
                const tB = allTrailers[b];
                const prioA = tA.status === 'PRIO' ? 1 : 0;
                const prioB = tB.status === 'PRIO' ? 1 : 0;
                if (prioA !== prioB) return prioB - prioA;
                return (tA.order || 0) - (tB.order || 0);
            });

            sortedIds.forEach(id => {
                const t = allTrailers[id];
                if (t.dag !== window.currentDay) return;

                if (!t.klar) {
                    aCount++;
                    const rowClass = t.status === 'PRIO' ? 'row-prio' : (t.status === 'Hittar ej' ? 'row-problem' : '');
                    const badgeClass = t.typ === 'In' ? 'badge-in' : (t.typ === 'Ut' ? 'badge-ut' : 'badge-fixa');

                    activeTable.innerHTML += `
                    <tr class="border-b ${rowClass}" data-id="${id}">
                        <td class="drag-handle">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M7 7h2v2H7V7zm0 4h2v2H7v-2zm4-4h2v2h-2V7zm0 4h2v2h-2v-2zM7 3h2v2H7V3zm4 0h2v2h-2V3zm-4 12h2v2H7v-2zm4 0h2v2h-2v-2z"/></svg>
                        </td>
                        <td class="p-2 sm:p-4"><input type="text" value="${t.nr}" onchange="updateVal('${id}', 'nr', this.value)" class="edit-input text-xl sm:text-4xl"></td>
                        <td class="p-2 sm:p-4"><input type="text" value="${t.port}" onchange="updateVal('${id}', 'port', this.value)" class="edit-input text-lg sm:text-3xl text-blue-600"></td>
                        <td class="p-2">
                             <div class="flex flex-col gap-1 items-start">
                                <span class="text-[9px] font-black text-slate-400 uppercase">${t.avd}</span>
                                <span class="${badgeClass}">${t.typ}</span>
                             </div>
                        </td>
                        <td class="p-2">
                            <select onchange="updateVal('${id}', 'status', this.value)" class="w-full bg-white border text-[10px] font-black p-1 rounded mb-1 shadow-sm">
                                <option value="Normal" ${t.status==='Normal'?'selected':''}>Normal</option>
                                <option value="PRIO" ${t.status==='PRIO'?'selected':''}>PRIO 🔥</option>
                                <option value="Hittar ej" ${t.status==='Hittar ej'?'selected':''}>Hittar ej ❓</option>
                            </select>
                            <input type="text" value="${t.notering||''}" onblur="updateVal('${id}', 'notering', this.value)" placeholder="Notering..." class="w-full text-[10px] italic border-b bg-transparent outline-none focus:border-blue-400">
                        </td>
                        <td class="p-2 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="markDone('${id}')" class="bg-green-600 text-white font-black px-4 py-3 rounded-xl text-[10px] uppercase shadow-md active:scale-90">KLAR</button>
                                <button onclick="deleteTrailer('${id}')" class="text-slate-300 px-2 text-xl hover:text-red-500">✕</button>
                            </div>
                        </td>
                    </tr>`;
                } else {
                    doneList.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-white border rounded-xl shadow-sm opacity-60">
                        <div class="flex items-center gap-3">
                            <span class="bg-green-500 text-white px-2 py-1 rounded font-black text-sm uppercase italic">${t.nr}</span>
                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">PORT ${t.port} - KLART ${t.utford}</span>
                        </div>
                        <button onclick="updateVal('${id}', 'klar', false)" class="text-blue-500 text-[10px] font-black uppercase italic">Ångra ↺</button>
                    </div>`;
                }
            });
            document.getElementById('activeCount').innerText = aCount + " st";
            document.getElementById('currentTabLabel').innerText = window.currentDay;
        }
    </script>
</body>
</html>
