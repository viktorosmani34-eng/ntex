<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TUGG Lista - Analytics Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        .row-prio { background-color: #fefce8 !important; border-left: 14px solid #eab308 !important; }
        .row-problem { background-color: #fff1f2 !important; border-left: 14px solid #e11d48 !important; }
        .badge { font-weight: 900; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; font-size: 11px; }
        .badge-in { background-color: #1e40af; color: white; }
        .badge-ut { background-color: #166534; color: white; }
        .badge-fixa { background-color: #92400e; color: white; }
        .tab-active { background: white !important; color: #2563eb !important; border-top: 5px solid #2563eb !important; }
        .edit-input { background: transparent; border: 2px solid transparent; outline: none; width: 100%; font-weight: 900; text-transform: uppercase; border-radius: 8px; color: #000; }
        .edit-input:focus { border-color: #3b82f6; background: #fff; }
        .drag-handle { cursor: grab; color: #94a3b8; display: flex; align-items: center; justify-content: center; width: 40px; }
        #loginOverlay { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 1.5rem; border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="antialiased min-h-screen pb-40">

    <div id="loginOverlay">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-sm mx-4 text-center">
            <h2 class="text-3xl font-black mb-10 uppercase italic tracking-tighter">Tugg Lista</h2>
            <input id="passInput" type="password" placeholder="LÖSENORD" class="w-full border-4 border-slate-100 p-5 rounded-2xl mb-5 text-center text-2xl font-black outline-none focus:border-blue-600">
            <button onclick="checkLogin()" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl uppercase shadow-xl active:scale-95 transition-all">Logga in</button>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-xl">
            <div class="max-w-6xl mx-auto px-4 py-5 flex justify-between items-center">
                <h1 class="text-xl font-black uppercase italic tracking-tighter">TUGG <span class="text-blue-500">PRO</span></h1>
                <button onclick="logout()" class="text-[10px] opacity-50 font-bold uppercase tracking-widest">Logga ut</button>
            </div>
        </header>

        <div class="max-w-6xl mx-auto px-2 pt-6">
            
            <div id="inputSection" class="bg-white p-6 rounded-[2rem] shadow-sm border-2 border-slate-200 mb-8 mx-2">
                <div class="grid grid-cols-2 gap-4 sm:grid-cols-5 items-end">
                    <div><label class="block text-[10px] font-black text-slate-500 mb-2 uppercase ml-1">Trailer</label>
                    <input id="trailerNr" type="text" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-xl font-black text-xl outline-none focus:border-blue-500 uppercase"></div>
                    <div><label class="block text-[10px] font-black text-slate-500 mb-2 uppercase ml-1">Port</label>
                    <input id="portNr" type="text" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-xl font-black text-xl outline-none focus:border-blue-500 text-center"></div>
                    <div class="hidden sm:block">
                        <label class="block text-[10px] font-black text-slate-500 mb-2 uppercase ml-1">Avd</label>
                        <select id="deptSelect" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-xl font-black outline-none"><option>Imp</option><option>Exp</option><option>Secu</option><option>Mattor</option><option>Xylem</option><option>Annat</option></select>
                    </div>
                    <div class="hidden sm:block">
                        <label class="block text-[10px] font-black text-slate-500 mb-2 uppercase ml-1">Typ</label>
                        <select id="typSelect" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-xl font-black outline-none"><option>In</option><option>Ut</option><option>Fixa</option></select>
                    </div>
                    <button id="addBtn" class="bg-slate-900 text-white font-black py-5 rounded-2xl uppercase text-xs shadow-lg active:scale-95 transition-all">Skapa</button>
                </div>
            </div>

            <div id="dailyView">
                <div class="bg-white rounded-[2.5rem] shadow-xl border-2 border-slate-200 overflow-hidden mb-8 mx-2">
                    <div class="bg-slate-50 px-6 py-4 border-b-2 border-slate-200 flex justify-between items-center">
                        <h2 class="text-slate-900 font-black uppercase italic tracking-tighter"><span id="currentTabLabel">Måndag</span></h2>
                        <span id="activeCount" class="bg-black text-white text-[10px] px-4 py-1.5 rounded-full font-black">0 AKTIVA</span>
                    </div>
                    <div class="overflow-x-auto"><table class="w-full"><tbody id="activeTable" class="divide-y divide-slate-100"></tbody></table></div>
                </div>

                <div class="px-4">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest">AVKLARADE</h3>
                        <button onclick="clearDayDone()" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl font-black text-[10px] uppercase border border-red-100 hover:bg-red-600 hover:text-white transition-all">Rensa listan</button>
                    </div>
                    <div id="doneList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-10"></div>
                </div>
            </div>

            <div id="statsView" class="hidden px-2">
                <div class="flex items-center gap-3 mb-6">
                    <h2 class="text-2xl font-black uppercase italic">Veckostatistik</h2>
                    <span class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-black" id="weekDisplay">v. --</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                    <div class="stat-card">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Medeltid / uppdrag</p>
                        <h4 class="text-3xl font-black text-blue-600" id="avgTimeText">0 min</h4>
                    </div>
                    <div class="stat-card">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">PRIO-tryck per dag</p>
                        <h4 class="text-3xl font-black text-amber-500" id="avgPrioText">0 st</h4>
                    </div>
                </div>
                <div class="stat-card mb-10">
                    <h4 class="text-xs font-black text-slate-400 uppercase mb-4 text-center">Produktion per dag (Antal trailers)</h4>
                    <canvas id="statsChart" height="250"></canvas>
                </div>
            </div>

            <footer class="text-center py-10">
                <p class="text-[11px] font-black text-slate-300 uppercase tracking-[0.3em]">Made with ❤️ from Viktor</p>
            </footer>
        </div>

        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-slate-200 flex z-50 shadow-2xl">
            <button onclick="switchTab('Måndag')" id="tab-Måndag" class="nav-tab flex-1 py-6 font-black text-[10px] uppercase text-slate-400 transition-all">Mån</button>
            <button onclick="switchTab('Tisdag')" id="tab-Tisdag" class="nav-tab flex-1 py-6 font-black text-[10px] uppercase text-slate-400 transition-all">Tis</button>
            <button onclick="switchTab('Onsdag')" id="tab-Onsdag" class="nav-tab flex-1 py-6 font-black text-[10px] uppercase text-slate-400 transition-all">Ons</button>
            <button onclick="switchTab('Torsdag')" id="tab-Torsdag" class="nav-tab flex-1 py-6 font-black text-[10px] uppercase text-slate-400 transition-all">Tor</button>
            <button onclick="switchTab('Fredag')" id="tab-Fredag" class="nav-tab flex-1 py-6 font-black text-[10px] uppercase text-slate-400 transition-all">Fre</button>
            <button onclick="switchTab('Statistik')" id="tab-Statistik" class="nav-tab flex-1 py-6 font-black text-[10px] uppercase text-blue-600 bg-blue-50">Statistik</button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCmVuLp-T9f_XGMmUnWZREK2gi8vvsiYb4",
            authDomain: "lagerlogistik-87feb.firebaseapp.com",
            databaseURL: "https://lagerlogistik-87feb-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lagerlogistik-87feb",
            storageBucket: "lagerlogistik-87feb.firebasestorage.app",
            messagingSenderId: "206906307140",
            appId: "1:206906307140:web:49acbdc1ab3445bc718211"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const trailersRef = ref(db, 'trailers');
        let allTrailers = {};
        let myChart = null;

        window.checkLogin = () => {
            if(document.getElementById('passInput').value.toLowerCase() === "tugglista") {
                localStorage.setItem('logistikLoginTime', Date.now());
                showApp();
            }
        };
        if (localStorage.getItem('logistikLoginTime')) showApp();
        function showApp() { document.getElementById('loginOverlay').style.display = 'none'; document.getElementById('mainContent').style.display = 'block'; }
        window.logout = () => { localStorage.removeItem('logistikLoginTime'); location.reload(); };

        window.currentDay = 'Måndag';
        window.switchTab = (tab) => { 
            window.currentDay = tab; 
            document.getElementById('dailyView').style.display = (tab === 'Statistik') ? 'none' : 'block';
            document.getElementById('inputSection').style.display = (tab === 'Statistik') ? 'none' : 'block';
            document.getElementById('statsView').style.display = (tab === 'Statistik') ? 'block' : 'none';
            renderAll(); 
        };

        window.createTrailer = () => {
            const nr = document.getElementById('trailerNr').value.trim();
            const port = document.getElementById('portNr').value.trim();
            if (!nr) return;
            push(trailersRef, {
                nr, port, typ: document.getElementById('typSelect').value,
                avd: document.getElementById('deptSelect').value,
                dag: window.currentDay, status: "Normal", klar: false, 
                timestamp: Date.now(), order: Date.now()
            });
            document.getElementById('trailerNr').value = ""; document.getElementById('portNr').value = "";
        };
        document.getElementById('addBtn').onclick = createTrailer;

        window.markDone = (id) => {
            update(ref(db, `trailers/${id}`), { 
                klar: true, 
                doneTimestamp: Date.now(),
                utford: new Date().toLocaleTimeString('sv-SE', {hour:'2-digit', minute:'2-digit'}) 
            });
        };

        window.clearDayDone = () => {
            if(confirm(`Vill du radera ALLA avklarade uppdrag för ${window.currentDay}?`)) {
                Object.keys(allTrailers).forEach(id => {
                    if(allTrailers[id].dag === window.currentDay && allTrailers[id].klar) {
                        remove(ref(db, `trailers/${id}`));
                    }
                });
            }
        };

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function renderStats() {
            const week = getWeekNumber(new Date());
            document.getElementById('weekDisplay').innerText = `v. ${week}`;
            
            let totalTime = 0; let doneCount = 0; let prioCount = 0;
            const dayMap = { 'Måndag': 0, 'Tisdag': 0, 'Onsdag': 0, 'Torsdag': 0, 'Fredag': 0 };

            Object.values(allTrailers).forEach(t => {
                if(t.klar && t.doneTimestamp && t.timestamp) {
                    totalTime += (t.doneTimestamp - t.timestamp);
                    doneCount++;
                    dayMap[t.dag] = (dayMap[t.dag] || 0) + 1;
                }
                if(t.status === 'PRIO') prioCount++;
            });

            const avgMin = doneCount > 0 ? Math.round((totalTime / doneCount) / 60000) : 0;
            document.getElementById('avgTimeText').innerText = `${avgMin} min`;
            document.getElementById('avgPrioText').innerText = `${(prioCount / 5).toFixed(1)} st`;

            if (myChart) myChart.destroy();
            const ctx = document.getElementById('statsChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(dayMap),
                    datasets: [{ label: 'Antal', data: Object.values(dayMap), backgroundColor: '#3b82f6', borderRadius: 8 }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });
        }

        onValue(trailersRef, (snapshot) => { allTrailers = snapshot.val() || {}; renderAll(); });

        function renderAll() {
            if(window.currentDay === 'Statistik') { renderStats(); }
            const activeTable = document.getElementById('activeTable');
            const doneList = document.getElementById('doneList');
            activeTable.innerHTML = ""; doneList.innerHTML = "";
            let aCount = 0;

            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('tab-' + window.currentDay).classList.add('tab-active');

            const sortedIds = Object.keys(allTrailers).sort((a,b) => (allTrailers[a].order || 0) - (allTrailers[b].order || 0));

            sortedIds.forEach(id => {
                const t = allTrailers[id];
                if (t.dag !== window.currentDay) return;
                if (!t.klar) {
                    aCount++;
                    const rowClass = t.status === 'PRIO' ? 'row-prio' : (t.status === 'Hittar ej' ? 'row-problem' : '');
                    activeTable.innerHTML += `<tr class="${rowClass}" data-id="${id}">
                        <td class="drag-handle p-4"><svg class="w-6 h-6 opacity-20" fill="currentColor" viewBox="0 0 20 20"><path d="M7 7h2v2H7V7zm0 4h2v2H7v-2zm4-4h2v2h-2V7zm0 4h2v2h-2v-2zM7 3h2v2H7V3zm4 0h2v2h-2V3zm-4 12h2v2H7v-2zm4 0h2v2h-2v-2z"/></svg></td>
                        <td class="p-4"><input type="text" value="${t.nr}" onchange="update(ref(db, 'trailers/${id}'), {nr: this.value})" class="edit-input text-2xl sm:text-4xl font-black italic"></td>
                        <td class="p-4"><input type="text" value="${t.port}" onchange="update(ref(db, 'trailers/${id}'), {port: this.value})" class="edit-input text-2xl text-blue-600 font-black"></td>
                        <td class="p-4"><button onclick="markDone('${id}')" class="bg-emerald-600 text-white font-black px-6 py-4 rounded-2xl text-xs active:scale-90">KLAR</button></td>
                    </tr>`;
                } else {
                    doneList.innerHTML += `<div class="flex justify-between items-center p-4 bg-white border-2 rounded-2xl opacity-60">
                        <span class="font-black italic">${t.nr} - PORT ${t.port}</span>
                        <span class="text-[10px] font-bold text-emerald-600">KLAR ${t.utford}</span>
                    </div>`;
                }
            });
            document.getElementById('activeCount').innerText = aCount + " AKTIVA";
            document.getElementById('currentTabLabel').innerText = window.currentDay;
        }

        Sortable.create(document.getElementById('activeTable'), { handle: '.drag-handle', animation: 150, onEnd: () => {
            document.getElementById('activeTable').querySelectorAll('tr').forEach((row, index) => update(ref(db, `trailers/${row.getAttribute('data-id')}`), { order: index }));
        }});
    </script>
</body>
</html>
