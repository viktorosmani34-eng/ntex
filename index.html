<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TUGG Lista - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Modern Row Colors */
        .row-prio { background-color: #fefce8 !important; border-left: 6px solid #eab308 !important; }
        .row-problem { background-color: #fef2f2 !important; border-left: 6px solid #ef4444 !important; }
        
        /* Premium Badges */
        .badge-in { background-color: #dbeafe; color: #1e3a8a; padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 800; }
        .badge-ut { background-color: #d1fae5; color: #065f46; padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 800; }
        .badge-fixa { background-color: #fef3c7; color: #92400e; padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 800; }

        /* Clean Active Tab */
        .tab-active { color: #2563eb !important; font-weight: 900 !important; border-top: 3px solid #2563eb !important; background: linear-gradient(to bottom, #eff6ff, transparent) !important; }
        
        /* Seamless Inputs */
        .edit-input { background: transparent; border: 2px solid transparent; outline: none; width: 100%; font-weight: 900; text-transform: uppercase; border-radius: 8px; transition: all 0.2s; padding: 2px 4px; margin-left: -4px; }
        .edit-input:focus { border-color: #bfdbfe; background: #fff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        .drag-handle { cursor: grab; color: #94a3b8; display: flex; align-items: center; justify-content: center; width: 30px; }
        .drag-handle:active { cursor: grabbing; color: #2563eb; }
        .sortable-ghost { opacity: 0.4; background: #e0e7ff; }

        /* Smooth Overlays */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        
        #undoToast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 100; display: none; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translate(-50%, 150%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

        /* Custom Scrollbar for desktop */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-28">

    <div id="undoToast" class="bg-slate-900/95 backdrop-blur-md text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-4 border border-slate-700">
        <span class="font-semibold text-sm tracking-wide">Uppdrag markerat som klart</span>
        <button id="undoBtn" class="bg-blue-600 hover:bg-blue-500 transition-colors px-4 py-1.5 rounded-full font-bold text-xs uppercase tracking-wider">Ångra</button>
    </div>

    <div id="loginOverlay">
        <div class="bg-white p-10 rounded-[2rem] shadow-2xl w-[22rem] text-center transform transition-all">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-inner text-3xl">🚛</div>
            <h2 class="text-2xl font-black mb-2 uppercase tracking-tight text-slate-800">Tugg Lista</h2>
            <p class="text-slate-400 text-xs font-semibold mb-8 uppercase tracking-widest">Logistik Portal</p>
            
            <input id="passInput" type="password" placeholder="Ange lösenord..." class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl mb-4 text-center text-lg font-bold outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all">
            <button onclick="checkLogin()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black py-4 rounded-xl uppercase tracking-widest shadow-lg shadow-blue-500/30 transition-all active:scale-95">Logga in</button>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <div class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200 shadow-sm">
            <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🚛</span>
                    <h1 class="text-xl font-black text-slate-800 uppercase tracking-tighter">Tugg Lista</h1>
                </div>
                <button onclick="logout()" class="text-[10px] bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-lg font-bold text-slate-500 uppercase tracking-widest transition-colors">Logga ut</button>
            </div>
        </div>

        <div class="max-w-6xl mx-auto px-3 pt-6">
            
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200/60 mb-8">
                <div class="grid grid-cols-2 gap-4 sm:grid-cols-5 items-end">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider ml-1">Trailer Nr</label>
                        <input id="trailerNr" type="text" placeholder="T.EX. 1234" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-2xl font-black outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 uppercase transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider ml-1">Port</label>
                        <input id="portNr" type="text" placeholder="PORT" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-2xl font-black outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all">
                    </div>
                    <div class="hidden sm:block">
                        <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider ml-1">Avdelning</label>
                        <select id="deptSelect" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-2xl font-bold outline-none focus:border-blue-500 transition-all cursor-pointer">
                            <option>Imp</option><option>Exp</option><option>Secu</option><option>Mattor</option><option>Xylem</option><option>Annat</option>
                        </select>
                    </div>
                    <div class="hidden sm:block">
                        <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider ml-1">Typ</label>
                        <select id="typSelect" class="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-2xl font-bold outline-none focus:border-blue-500 transition-all cursor-pointer">
                            <option>In</option><option>Ut</option><option>Fixa</option>
                        </select>
                    </div>
                    <div class="col-span-2 sm:col-span-1 mt-2 sm:mt-0">
                       <button id="addBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-black py-4 rounded-2xl shadow-lg uppercase text-xs tracking-widest active:scale-95 transition-all flex justify-center items-center gap-2">
                            <span>Skapa</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                       </button>
                    </div>
                </div>
            </div>

            <div id="dailyView">
                <div class="flex justify-between items-end mb-3 px-2">
                    <h2 class="text-sm font-black text-slate-800 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                        Aktiva <span class="text-slate-400">/</span> <span id="currentTabLabel" class="text-blue-600">Måndag</span>
                    </h2>
                    <span id="activeCount" class="bg-slate-800 text-white text-[10px] px-3 py-1 rounded-full font-bold tracking-wider shadow-sm">0 st</span>
                </div>
                
                <div class="bg-white rounded-3xl shadow-sm border border-slate-200/60 overflow-hidden mb-8">
                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse">
                            <thead class="bg-slate-50/50 border-b border-slate-100 text-[10px] uppercase text-slate-400 font-bold tracking-wider">
                                <tr>
                                    <th class="py-4 pl-2 w-8"></th>
                                    <th class="py-4 px-2 text-left">Trailer</th>
                                    <th class="py-4 px-2 text-left">Port</th>
                                    <th class="py-4 px-2 text-left">Info</th>
                                    <th class="py-4 px-2 text-left">Status & Notering</th>
                                    <th class="py-4 pr-4 text-right">Åtgärd</th>
                                </tr>
                            </thead>
                            <tbody id="activeTable" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>

                <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 ml-2">✅ Avklarade idag</h2>
                <div id="doneList" class="space-y-2 mb-10"></div>
            </div>

            <div class="text-center mt-12 mb-8">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Made with <span class="text-red-500">❤️</span> from Viktor</p>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-xl border-t border-slate-200/50 flex z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] pb-safe">
            <button onclick="switchTab('Måndag')" id="tab-Måndag" class="nav-tab flex-1 py-5 font-bold text-[10px] uppercase text-slate-400 transition-colors">Mån</button>
            <button onclick="switchTab('Tisdag')" id="tab-Tisdag" class="nav-tab flex-1 py-5 font-bold text-[10px] uppercase text-slate-400 transition-colors">Tis</button>
            <button onclick="switchTab('Onsdag')" id="tab-Onsdag" class="nav-tab flex-1 py-5 font-bold text-[10px] uppercase text-slate-400 transition-colors">Ons</button>
            <button onclick="switchTab('Torsdag')" id="tab-Torsdag" class="nav-tab flex-1 py-5 font-bold text-[10px] uppercase text-slate-400 transition-colors">Tor</button>
            <button onclick="switchTab('Fredag')" id="tab-Fredag" class="nav-tab flex-1 py-5 font-bold text-[10px] uppercase text-slate-400 transition-colors">Fre</button>
        </div>
    </div>

    <style> .pb-safe { padding-bottom: env(safe-area-inset-bottom); } </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCmVuLp-T9f_XGMmUnWZREK2gi8vvsiYb4",
            authDomain: "lagerlogistik-87feb.firebaseapp.com",
            databaseURL: "https://lagerlogistik-87feb-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lagerlogistik-87feb",
            storageBucket: "lagerlogistik-87feb.firebasestorage.app",
            messagingSenderId: "206906307140",
            appId: "1:206906307140:web:49acbdc1ab3445bc718211"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const trailersRef = ref(db, 'trailers');
        let allTrailers = {};
        let undoTimer = null;
        let lastFinishedId = null;

        window.checkLogin = () => {
            if(document.getElementById('passInput').value === "Tugglista") {
                localStorage.setItem('logistikLoginTime', Date.now());
                showApp();
            }
        };

        document.getElementById('passInput').addEventListener('keypress', function(e) {
            if(e.key === 'Enter') checkLogin();
        });

        function showApp() {
            document.getElementById('loginOverlay').style.opacity = '0';
            setTimeout(() => { document.getElementById('loginOverlay').style.display = 'none'; }, 300);
            document.getElementById('mainContent').style.display = 'block';
        }

        window.logout = () => { localStorage.removeItem('logistikLoginTime'); location.reload(); };
        if (localStorage.getItem('logistikLoginTime')) showApp();

        window.currentDay = 'Måndag';
        window.switchTab = (tab) => { window.currentDay = tab; renderAll(); };

        document.getElementById('addBtn').onclick = createTrailer;
        document.getElementById('portNr').addEventListener('keypress', function(e) {
            if(e.key === 'Enter') createTrailer();
        });

        function createTrailer() {
            const nr = document.getElementById('trailerNr').value.trim();
            const port = document.getElementById('portNr').value.trim();
            if (!nr) return;
            push(trailersRef, {
                nr, port, 
                typ: document.getElementById('typSelect').value,
                avd: document.getElementById('deptSelect').value,
                dag: window.currentDay, 
                status: "Normal", 
                notering: "",
                klar: false, 
                timestamp: Date.now(),
                order: Date.now()
            });
            document.getElementById('trailerNr').value = ""; document.getElementById('portNr').value = "";
            document.getElementById('trailerNr').focus();
        }

        window.updateVal = (id, field, val) => update(ref(db, `trailers/${id}`), { [field]: val });

        window.markDone = (id) => {
            update(ref(db, `trailers/${id}`), { 
                klar: true, 
                utford: new Date().toLocaleTimeString('sv-SE', {hour:'2-digit', minute:'2-digit'}) 
            });
            lastFinishedId = id;
            const toast = document.getElementById('undoToast');
            toast.style.display = 'flex';
            clearTimeout(undoTimer);
            undoTimer = setTimeout(() => toast.style.display = 'none', 5000);
        };

        document.getElementById('undoBtn').onclick = () => {
            if(lastFinishedId) {
                update(ref(db, `trailers/${lastFinishedId}`), { klar: false });
                document.getElementById('undoToast').style.display = 'none';
            }
        };

        window.deleteTrailer = (id) => {
            if(confirm("Radera detta uppdrag?")) remove(ref(db, `trailers/${id}`));
        };

        const el = document.getElementById('activeTable');
        Sortable.create(el, {
            handle: '.drag-handle',
            animation: 250,
            easing: "cubic-bezier(1, 0, 0, 1)",
            ghostClass: 'sortable-ghost',
            onEnd: function() {
                const rows = el.querySelectorAll('tr');
                rows.forEach((row, index) => {
                    const id = row.getAttribute('data-id');
                    update(ref(db, `trailers/${id}`), { order: index });
                });
            }
        });

        onValue(trailersRef, (snapshot) => { 
            allTrailers = snapshot.val() || {}; 
            renderAll(); 
        });

        function renderAll() {
            const activeTable = document.getElementById('activeTable');
            const doneList = document.getElementById('doneList');
            activeTable.innerHTML = ""; doneList.innerHTML = "";
            let aCount = 0;

            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('tab-active'));
            const activeTabBtn = document.getElementById('tab-' + window.currentDay);
            if(activeTabBtn) activeTabBtn.classList.add('tab-active');

            const sortedIds = Object.keys(allTrailers).sort((a,b) => {
                const tA = allTrailers[a]; const tB = allTrailers[b];
                const prioA = tA.status === 'PRIO' ? 1 : 0; const prioB = tB.status === 'PRIO' ? 1 : 0;
                if (prioA !== prioB) return prioB - prioA;
                return (tA.order || tA.timestamp) - (tB.order || tB.timestamp);
            });

            sortedIds.forEach(id => {
                const t = allTrailers[id];
                if (t.dag !== window.currentDay) return;

                if (!t.klar) {
                    aCount++;
                    const rowClass = t.status === 'PRIO' ? 'row-prio' : (t.status === 'Hittar ej' ? 'row-problem' : 'hover:bg-slate-50/50');
                    const badgeClass = t.typ === 'In' ? 'badge-in' : (t.typ === 'Ut' ? 'badge-ut' : 'badge-fixa');

                    activeTable.innerHTML += `
                    <tr class="${rowClass} transition-colors group" data-id="${id}">
                        <td class="drag-handle py-4 pl-2">
                            <svg class="w-5 h-5 opacity-50 group-hover:opacity-100 transition-opacity" fill="currentColor" viewBox="0 0 20 20"><path d="M7 7h2v2H7V7zm0 4h2v2H7v-2zm4-4h2v2h-2V7zm0 4h2v2h-2v-2zM7 3h2v2H7V3zm4 0h2v2h-2V3zm-4 12h2v2H7v-2zm4 0h2v2h-2v-2z"/></svg>
                        </td>
                        <td class="p-2 sm:p-4 w-1/4 sm:w-auto"><input type="text" value="${t.nr}" onchange="updateVal('${id}', 'nr', this.value)" class="edit-input text-2xl sm:text-3xl text-slate-800"></td>
                        <td class="p-2 sm:p-4 w-1/4 sm:w-auto"><input type="text" value="${t.port}" onchange="updateVal('${id}', 'port', this.value)" class="edit-input text-xl sm:text-2xl text-blue-600"></td>
                        <td class="p-2 sm:p-4">
                             <div class="flex flex-col gap-1.5 items-start mt-1">
                                <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest bg-slate-100 px-2 py-0.5 rounded">${t.avd}</span>
                                <span class="${badgeClass}">${t.typ}</span>
                             </div>
                        </td>
                        <td class="p-2 sm:p-4 min-w-[120px]">
                            <select onchange="updateVal('${id}', 'status', this.value)" class="w-full bg-slate-50 border border-slate-200 text-[10px] font-bold p-1.5 rounded-lg mb-1.5 outline-none focus:border-blue-400 cursor-pointer text-slate-600">
                                <option value="Normal" ${t.status==='Normal'?'selected':''}>Normal</option>
                                <option value="PRIO" ${t.status==='PRIO'?'selected':''}>PRIO 🔥</option>
                                <option value="Hittar ej" ${t.status==='Hittar ej'?'selected':''}>Hittar ej ❓</option>
                            </select>
                            <input type="text" value="${t.notering||''}" onblur="updateVal('${id}', 'notering', this.value)" placeholder="Skriv notering..." class="w-full text-xs font-medium italic bg-transparent outline-none border-b border-transparent focus:border-blue-300 text-slate-500 placeholder-slate-300 transition-colors">
                        </td>
                        <td class="p-2 sm:p-4 text-right pr-4">
                            <div class="flex items-center justify-end gap-1 sm:gap-3">
                                <button onclick="markDone('${id}')" class="bg-emerald-500 hover:bg-emerald-400 text-white font-black px-4 sm:px-6 py-2 sm:py-3 rounded-xl text-[10px] uppercase shadow-sm shadow-emerald-500/30 active:scale-90 transition-all">KLAR</button>
                                <button onclick="deleteTrailer('${id}')" class="text-slate-300 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition-all">
                                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                        </td>
                    </tr>`;
                } else {
                    doneList.innerHTML += `
                    <div class="flex justify-between items-center p-3.5 bg-white border border-slate-200/60 rounded-2xl shadow-sm opacity-70 hover:opacity-100 transition-opacity">
                        <div class="flex items-center gap-4">
                            <span class="bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-lg font-black text-sm uppercase">${t.nr}</span>
                            <div class="flex flex-col">
                                <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">PORT ${t.port}</span>
                                <span class="text-[9px] font-bold text-slate-400">Klart kl. ${t.utford}</span>
                            </div>
                        </div>
                        <button onclick="updateVal('${id}', 'klar', false)" class="text-blue-500 hover:text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider transition-colors">Ångra</button>
                    </div>`;
                }
            });
            document.getElementById('activeCount').innerText = aCount + " st";
            document.getElementById('currentTabLabel').innerText = window.currentDay;
        }
    </script>
</body>
</html>
