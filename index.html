<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUG Lista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-excel-done { background-color: #00ff00 !important; color: black !important; font-weight: 900; }
        .row-prio { background-color: #fef08a !important; border-left: 10px solid #facc15 !important; }
        .row-problem { background-color: #fee2e2 !important; border-left: 10px solid #f87171 !important; }
        .row-error-done { background-color: #fecaca !important; border: 2px solid #ef4444 !important; }
        .tab-active { background-color: white !important; border-top: 4px solid #3b82f6 !important; color: #1e40af !important; font-weight: 900 !important; }

        .badge-fixa { background-color: #f59e0b; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; }
        .badge-in { background-color: #3b82f6; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; }
        .badge-ut { background-color: #10b981; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; }

        .excel-table td, .excel-table th { border: 1px solid #cbd5e1; padding: 8px; text-align: center; }
        .excel-table input { width: 100%; border: none; outline: none; background: transparent; font-weight: bold; text-align: center; }

        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e293b; z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-24 sm:pb-48 font-sans text-slate-700">

    <div id="loginOverlay">
        <div class="bg-white p-6 sm:p-10 rounded-2xl shadow-2xl w-80 sm:w-96 text-center border-t-8 border-blue-600">
            <h2 class="text-xl sm:text-2xl font-black mb-4 sm:mb-6 uppercase tracking-tighter text-slate-800 italic">🚛 Tug Lista</h2>
            <input id="passInput" type="password" placeholder="Lösenord" class="w-full border-2 p-3 sm:p-4 rounded-xl mb-3 sm:mb-4 text-center text-lg sm:text-xl font-bold outline-none border-slate-200 focus:border-blue-500">
            <button onclick="checkLogin()" class="w-full bg-blue-600 text-white font-black py-3 sm:py-4 rounded-xl uppercase shadow-lg hover:bg-blue-700 text-sm sm:text-base">Logga in</button>
            <p id="errorMsg" class="text-red-500 text-xs mt-3 sm:mt-4 font-bold hidden">FEL LÖSENORD!</p>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <div class="max-w-6xl mx-auto px-2 sm:px-4 pt-4 sm:pt-8">
            <div class="flex justify-between items-center mb-4 sm:mb-8">
                <h1 class="text-xl sm:text-2xl font-black text-slate-800 flex items-center gap-2">🚛 Tug Lista</h1>
                <button onclick="logout()" class="text-[9px] sm:text-[10px] font-bold text-slate-400 hover:text-red-500 uppercase tracking-widest">Logga ut</button>
            </div>

            <div id="dailyView">
                <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 sm:mb-10">
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 items-end">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Trailer nr</label>
                            <input id="trailerNr" type="text" class="w-full border border-slate-300 p-2 sm:p-3 rounded-xl font-bold outline-none focus:border-blue-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Port</label>
                            <input id="portNr" type="text" class="w-full border border-slate-300 p-2 sm:p-3 rounded-xl font-bold outline-none focus:border-blue-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Avdelning</label>
                            <select id="deptSelect" class="w-full border border-slate-300 p-2 sm:p-3 rounded-xl font-bold bg-white">
                                <option>Imp</option><option>Exp</option><option>Secu</option><option>Mattor</option><option>Xylem</option><option>Annat</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Typ</label>
                            <select id="typSelect" class="w-full border border-slate-300 p-2 sm:p-3 rounded-xl font-bold bg-white">
                                <option>In</option><option>Ut</option><option>Fixa</option>
                            </select>
                        </div>
                        <div class="lg:col-span-1 sm:col-span-2 md:col-span-1">
                           <button id="addBtn" class="w-full bg-blue-600 text-white font-black py-3 sm:py-4 rounded-xl shadow-xl uppercase text-xs active:scale-95 transition-all">Skapa rad</button>
                        </div>
                    </div>
                </div>

                <div class="mb-10 sm:mb-14">
                    <div class="bg-[#1e293b] p-3 sm:p-4 rounded-t-2xl flex justify-between items-center">
                        <h2 class="text-white text-xs font-black uppercase tracking-widest italic">⚠️ SKA GÖRAS NU - <span id="currentTabLabel">Måndag</span></h2>
                        <span id="activeCount" class="bg-red-500 text-white text-[9px] sm:text-[10px] px-2 sm:px-3 py-1 rounded-full font-black">0 st</span>
                    </div>
                    <div class="bg-white rounded-b-2xl shadow-2xl border border-slate-300">
                        <div class="overflow-x-auto">
                            <table class="w-full border-collapse">
                                <thead class="bg-slate-50 border-b text-[9px] sm:text-[10px] uppercase text-slate-400 font-bold">
                                    <tr><th class="p-3 sm:p-5 text-left">Trailer</th><th class="p-3 sm:p-5 text-left">Port/Typ</th><th class="p-3 sm:p-5 text-left">Avd</th><th class="p-3 sm:p-5 text-left w-auto sm:w-1/4">Status/Notering</th><th class="p-3 sm:p-5 text-left">Begärt</th><th class="p-3 sm:p-5 text-center">Åtgärd</th></tr>
                                </thead>
                                <tbody id="activeTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="bg-slate-200/50 p-3 sm:p-4 rounded-t-2xl flex justify-between items-center border border-slate-300">
                        <h2 class="text-slate-500 text-[9px] sm:text-[10px] font-black uppercase italic">✅ REDAN KLARA (<span id="doneCount">0</span> ST UTFÖRDA)</h2>
                        <button onclick="clearHistory()" class="text-red-500 bg-red-50 px-3 sm:px-4 py-1 sm:py-2 rounded-lg text-[8px] sm:text-[9px] font-black uppercase border border-red-300 hover:bg-red-500 hover:text-white transition-all">🗑️ Rensa</button>
                    </div>
                    <div id="doneList" class="space-y-3 sm:space-y-4 bg-slate-50/50 p-4 sm:p-6 rounded-b-2xl border-x border-b border-slate-300">
                        <!-- Done list items will be rendered here -->
                    </div>
                </div>
            </div>

            <div id="statsView" class="hidden">
                <div class="bg-white p-4 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex flex-col sm:flex-row justify-between mb-4 sm:mb-6 items-center">
                        <h2 class="text-lg sm:text-xl font-black uppercase italic text-blue-600 mb-2 sm:mb-0">📈 Veckoöversikt</h2>
                        <button onclick="addNewWeekRow()" class="bg-blue-600 text-white px-3 sm:px-4 py-2 rounded-lg text-xs font-black uppercase">
                            <span class="hidden sm:inline">+ Ny vecka</span>
="nav-tab flex-1 py-4 sm:py-5 font-bold text-[10px] sm:text-[11px] uppercase border-r text-slate-500">Tor</button>
            <button onclick="switchTab('Fredag')" id="tab-Fredag" class="nav-tab flex-1 py-4 sm:py-5 font-bold text-[10px] sm:text-[11px] uppercase border-r text-slate-500">Fre</button>
            <button onclick="switchTab('Översikt')" id="tab-Översikt" class="nav-tab flex-1 py-4 sm:py-5 font-black text-[10px] sm:text-[11px] uppercase text-blue-600 bg-blue-50 italic">Översikt</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCmVuLp-T9f_XGMmUnWZREK2gi8vvsiYb4",
            authDomain: "lagerlogistik-87feb.firebaseapp.com",
            databaseURL: "https://lagerlogistik-87feb-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lagerlogistik-87feb",
            storageBucket: "lagerlogistik-87feb.firebasestorage.app",
            messagingSenderId: "206906307140",
            appId: "1:206906307140:web:49acbdc1ab3445bc718211"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const trailersRef = ref(db, 'trailers');
        const weeksRef = ref(db, 'weeks');
        let allTrailers = {};
        window.currentDay = 'Måndag';

        // --- INLOGGNINGSLOGIK MED 1 TIMMES TIMEOUT ---
        const SESSION_TIMEOUT = 60 * 60 * 1000;

        window.checkLogin = () => {
            const pass = document.getElementById('passInput').value;
            if(pass === "Tuglista") {
                const now = Date.now();
                localStorage.setItem('logistikLoginTime', now);
                showApp();
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        };

        function showApp() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        window.logout = () => {
            localStorage.removeItem('logistikLoginTime');
            location.reload();
        };

        // Kolla vid uppstart
        const lastLogin = localStorage.getItem('logistikLoginTime');
        if (lastLogin && (Date.now() - lastLogin < SESSION_TIMEOUT)) {
            showApp();
        }

        // --- NEW INLINE EDITING FUNCTION ---
        window.startInlineEdit = (event, id, field, initialValue) => {
            event.stopPropagation(); // Prevents other potential double-click events on parent elements
            const originalElement = event.currentTarget; // The <td> or <span> that was double-clicked

            // Create an input element
            const input = document.createElement('input');
            input.type = 'text'; // Use 'text' for flexibility (e.g., 'A1' for port)
            input.value = initialValue;

            // Apply Tailwind CSS classes for consistent styling
            let inputClasses = 'w-full border-2 p-1 rounded-md text-center focus:outline-none focus:border-blue-500';
            if (field === 'nr') {
                inputClasses += ' font-black text-2xl sm:text-4xl'; // Matches trailer nr styling
            } else if (field === 'port') {
                inputClasses += ' font-bold text-slate-500 uppercase italic text-sm sm:text-base'; // Matches port styling
            }
            input.className = inputClasses;

            // Replace the clicked element with the input field
            originalElement.replaceWith(input);
            input.focus(); // Automatically focus the input for immediate editing

            // Function to save changes
            const saveChanges = () => {
                const newValue = input.value.trim();
                if (newValue !== initialValue) {
                    // Value has changed, update Firebase
                    update(ref(db, `trailers/${id}`), { [field]: newValue })
                        .then(() => {
                            // Firebase's `onValue` listener will automatically trigger `renderAll`
                            // to update the UI with the new data.
                        })
                        .catch(error => {
                            console.error("Error updating field:", error);
                            // If there's an error, re-render to revert the UI or show an error message
                            renderAll();
                        });
                } else {
                    // No change, just revert the input back to its display state
                    renderAll();
                }
            };

            // Save on blur (when the input loses focus)
            input.onblur = saveChanges;

            // Save on Enter key press
            input.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    input.blur(); // Trigger the onblur event to save
                }
            };
        };


        // --- RESTEN AV FUNKTIONERNA ---

        window.switchTab = (tab) => {
            window.currentDay = tab;
            document.getElementById('dailyView').classList.toggle('hidden', tab === 'Översikt');
            document.getElementById('statsView').classList.toggle('hidden', tab !== 'Översikt');
            renderAll();
        };

        document.getElementById('addBtn').onclick = () => {
            const nr = document.getElementById('trailerNr').value.trim();
            const port = document.getElementById('portNr').value.trim();
            if (!nr) return;
            push(trailersRef, {
                nr, port, typ: document.getElementById('typSelect').value,
                avd: document.getElementById('deptSelect').value,
                dag: window.currentDay, status: "Normal", notering: "",
                begart: new Date().toLocaleTimeString('sv-SE', {hour:'2-digit', minute:'2-digit'}),
                klar: false, error: false, timestamp: Date.now()
            });
            document.getElementById('trailerNr').value = ""; document.getElementById('portNr').value = "";
        };

        window.markDone = (id) => {
            const noteInput = document.getElementById(`note-${id}`);
            const finalNote = noteInput ? noteInput.value : (allTrailers[id].notering || "");
            const t = allTrailers[id];
            const now = new Date();
            const utTime = now.toLocaleTimeString('sv-SE', {hour:'2-digit', minute:'2-digit'});
            const [bH, bM] = t.begart.split(':').map(Number);
            let diff = (now.getHours() * 60 + now.getMinutes()) - (bH * 60 + bM);
            if (diff < 0) diff += 1440;
            const total = `${Math.floor(diff/60)}h ${diff%60}m`;
            update(ref(db, `trailers/${id}`), { klar: true, utford: utTime, total: total, notering: finalNote });
        };

        window.updateVal = (id, field, val) => update(ref(db, `trailers/${id}`), { [field]: val });
        window.deleteTrailer = (id) => confirm("Radera?") && remove(ref(db, `trailers/${id}`));
        window.clearHistory = () => confirm("Rensa?") && Object.keys(allTrailers).forEach(id => {
            if (allTrailers[id].dag === window.currentDay && allTrailers[id].klar) remove(ref(db, `trailers/${id}`));
        });

        window.addNewWeekRow = () => push(weeksRef, { v: "V.00", mon: 0, tue: 0, wed: 0, thu: 0, fri: 0 });
        window.updateWeek = (id, f, v) => update(ref(db, `weeks/${id}`), { [f]: v });

        onValue(trailersRef, (snapshot) => { allTrailers = snapshot.val() || {}; renderAll(); });
        onValue(weeksRef, (snapshot) => {
            const weekBody = document.getElementById('weekBody');
            if(!weekBody) return;
            weekBody.innerHTML = "";
            const weeks = snapshot.val() || {};
            Object.keys(weeks).forEach(id => {
                const w = weeks[id];
                const total = (Number(w.mon)||0) + (Number(w.tue)||0) + (Number(w.wed)||0) + (Number(w.thu)||0) + (Number(w.fri)||0);
                weekBody.innerHTML += `<tr>
                    <td><input value="${w.v}" onchange="updateWeek('${id}', 'v', this.value)"></td>
                    <td><input type="number" value="${w.mon}" onchange="updateWeek('${id}', 'mon', this.value)"></td>
                    <td><input type="number" value="${w.tue}" onchange="updateWeek('${id}', 'tue', this.value)"></td>
                    <td><input type="number" value="${w.wed}" onchange="updateWeek('${id}', 'wed', this.value)"></td>
                    <td><input type="number" value="${w.thu}" onchange="updateWeek('${id}', 'thu', this.value)"></td>
                    <td><input type="number" value="${w.fri}" onchange="updateWeek('${id}', 'fri', this.value)"></td>
                    <td class="font-black text-blue-600">${total}</td>
                    <td><button onclick="confirm('Radera?') && remove(ref(db, 'weeks/${id}'))">🗑️</button></td></tr>`;
            });
        });

        function renderAll() {
            const activeTable = document.getElementById('activeTable');
            const doneList = document.getElementById('doneList');
            if(!activeTable || !doneList) return;

            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('tab-active'));
            const activeTab = document.getElementById('tab-' + window.currentDay);
            if(activeTab) activeTab.classList.add('tab-active');

            activeTable.innerHTML = ""; doneList.innerHTML = "";
            let aCount = 0, dCount = 0;

            const sortedIds = Object.keys(allTrailers).sort((a,b) => allTrailers[a].timestamp -No response
'?'selected':''}>PRIO</option>
                                <option ${t.status==='Hittar ej'?'selected':''}>Hittar ej</option>
                            </select>
                            <input id="note-${id}" type="text" value="${t.notering||''}" onblur="updateVal('${id}', 'notering', this.value)" placeholder="Skriv notering..." class="w-full text-xs italic font-bold border-b-2 py-1 outline-none">
                        </td>
                        <td class="p-3 sm:p-5 font-black text-xl sm:text-2xl text-slate-400 tracking-tighter italic">${t.begart}</td>
                        <td class="p-3 sm:p-5 flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-6">
                            <button onclick="markDone('${id}')" class="bg-green-600 text-white font-black px-6 sm:px-12 py-3 sm:py-5 rounded-2xl shadow-xl uppercase text-xs active:scale-95">KLAR</button>
                            <button onclick="deleteTrailer('${id}')" class="text-slate-200 hover:text-red-500 font-bold text-lg sm:text-xl">✕</button>
                        </td>
                    </tr>`;
                } else {
                    dCount++;
                    doneList.innerHTML += `
                    <div class="flex flex-col sm:flex-row justify-between items-center p-4 sm:p-5 bg-white border border-slate-300 rounded-2xl shadow-sm ${t.error?'row-error-done':''}">
                        <div class="flex flex-col sm:flex-row items-center gap-4 sm:gap-10 text-center sm:text-left mb-2 sm:mb-0">
                            <div class="bg-excel-done px-6 sm:px-8 py-2 sm:py-3 rounded-xl text-2xl sm:text-3xl border-2 border-green-300 shadow-inner">${t.nr}</div>
                            <div class="font-bold text-slate-400 uppercase italic leading-tight text-xs sm:text-sm">
                                PORT ${t.port} (${t.typ}) - <span class="text-blue-500 font-black">${t.avd}</span><br>
                                <span class="text-slate-800 text-sm sm:text-base font-black not-italic block mt-1">${t.notering ? '📝 ' + t.notering : ''}</span>
                            </div>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-4 sm:gap-10 items-center w-full sm:w-auto mt-4 sm:mt-0 pt-4 sm:pt-0 border-t sm:border-t-0 border-slate-200 sm:border-l sm:pl-10">
                            <div class="text-center"><p class="text-[8px] sm:text-[9px] text-slate-400 uppercase">Begärt</p><p class="font-bold text-sm sm:text-base">${t.begart}</p></div>
                            <div class="text-center"><p class="text-[8px] sm:text-[9px] text-slate-400 uppercase">Klart</p><p class="font-bold text-green-600 text-sm sm:text-base">${t.utford}</p></div>
                            <div class="text-center border-l sm:pl-10"><p class="text-[8px] sm:text-[9px] text-slate-400 uppercase">Total Tid</p><p class="text-lg sm:text-xl text-blue-600 font-black">${t.total}</p></div>
                            <button onclick="updateVal('${id}', 'error', ${!t.error})" class="text-xl sm:text-2xl ${t.error?'text-red-600':'text-slate-200'}">⚠️</button>
                            <button onclick="updateVal('${id}', 'klar', false)" class="text-slate-300 hover:text-blue-500 text-lg sm:text-xl">↺</button>
                        </div>
                    </div>`;
                }
            });
            document.getElementById('activeCount').innerText = aCount + " st";
            document.getElementById('doneCount').innerText = dCount;
            document.getElementById('currentTabLabel').innerText = window.currentDay;
        }
    </script>
</body>
</html>
