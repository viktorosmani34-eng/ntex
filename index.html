<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUG Lista - Mobiloptimerad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-excel-done { background-color: #00ff00 !important; color: black !important; font-weight: 900; }
        .row-prio { background-color: #fef08a !important; border-left: 8px solid #facc15 !important; }
        .row-problem { background-color: #fee2e2 !important; border-left: 8px solid #f87171 !important; }
        .row-error-done { background-color: #fecaca !important; border: 2px solid #ef4444 !important; }
        .tab-active { background-color: white !important; border-top: 4px solid #3b82f6 !important; color: #1e40af !important; font-weight: 900 !important; }

        .badge-fixa { background-color: #f59e0b; color: white; padding: 1px 6px; border-radius: 4px; font-size: 9px; font-weight: 900; }
        .badge-in { background-color: #3b82f6; color: white; padding: 1px 6px; border-radius: 4px; font-size: 9px; font-weight: 900; }
        .badge-ut { background-color: #10b981; color: white; padding: 1px 6px; border-radius: 4px; font-size: 9px; font-weight: 900; }

        .edit-input { background: transparent; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .edit-input:focus { border-bottom-color: #3b82f6; outline: none; background: rgba(59, 130, 246, 0.05); }

        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e293b; z-index: 9999; display: flex; align-items: center; justify-content: center;
        }

        /* Mobil-specifika justeringar */
        @media (max-width: 640px) {
            .btn-klar-mobile { width: 100px; height: 55px; font-size: 1.1rem !important; }
            .trailer-text-mobile { font-size: 2.2rem !important; line-height: 1; }
            .port-text-mobile { font-size: 1.5rem !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-32 sm:pb-48 font-sans text-slate-700">

    <div id="loginOverlay">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-80 text-center border-t-8 border-blue-600">
            <h2 class="text-2xl font-black mb-6 uppercase italic">🚛 Tug Lista</h2>
            <input id="passInput" type="password" placeholder="Lösenord" class="w-full border-2 p-4 rounded-xl mb-4 text-center text-xl font-bold outline-none border-slate-200 focus:border-blue-500">
            <button onclick="checkLogin()" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl uppercase shadow-lg hover:bg-blue-700">Logga in</button>
            <p id="errorMsg" class="text-red-500 text-xs mt-4 font-bold hidden">FEL LÖSENORD!</p>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <div class="max-w-6xl mx-auto px-2 sm:px-4 pt-4">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-black text-slate-800 italic">🚛 TUG LISTA</h1>
                <button onclick="logout()" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Logga ut</button>
            </div>

            <div id="dailyView">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6">
                    <div class="grid grid-cols-2 gap-3 sm:grid-cols-5 items-end">
                        <div class="col-span-1">
                            <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase">Trailer</label>
                            <input id="trailerNr" type="text" class="w-full border border-slate-300 p-3 rounded-xl font-bold outline-none focus:border-blue-500">
                        </div>
                        <div class="col-span-1">
                            <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase">Port</label>
                            <input id="portNr" type="text" class="w-full border border-slate-300 p-3 rounded-xl font-bold outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase">Avd</label>
                            <select id="deptSelect" class="w-full border border-slate-300 p-3 rounded-xl font-bold bg-white">
                                <option>Imp</option><option>Exp</option><option>Secu</option><option>Mattor</option><option>Xylem</option><option>Annat</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase">Typ</label>
                            <select id="typSelect" class="w-full border border-slate-300 p-3 rounded-xl font-bold bg-white">
                                <option>In</option><option>Ut</option><option>Fixa</option>
                            </select>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                           <button id="addBtn" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg uppercase text-xs active:scale-95 transition-all">Skapa rad</button>
                        </div>
                    </div>
                </div>

                <div class="mb-8">
                    <div class="bg-[#1e293b] p-3 rounded-t-2xl flex justify-between items-center">
                        <h2 class="text-white text-[10px] font-black uppercase italic tracking-widest">⚠️ ATT GÖRA - <span id="currentTabLabel">Måndag</span></h2>
                        <span id="activeCount" class="bg-red-500 text-white text-[10px] px-3 py-1 rounded-full font-black">0 st</span>
                    </div>
                    <div class="bg-white rounded-b-2xl shadow-xl border border-slate-300 overflow-hidden">
                        <table class="w-full border-collapse">
                            <thead class="bg-slate-50 border-b text-[10px] uppercase text-slate-400 font-bold hidden sm:table-header-group">
                                <tr>
                                    <th class="p-4 text-left">Trailer</th>
                                    <th class="p-4 text-left">Port</th>
                                    <th class="p-4 text-left">Avd</th>
                                    <th class="p-4 text-left hidden md:table-cell">Notering</th>
                                    <th class="p-4 text-center">Åtgärd</th>
                                </tr>
                            </thead>
                            <tbody id="activeTable"></tbody>
                        </table>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2 px-2">
                        <h2 class="text-slate-500 text-[10px] font-black uppercase italic">✅ KLARA IDAG (<span id="doneCount">0</span>)</h2>
                        <button onclick="clearHistory()" class="text-red-500 text-[9px] font-bold uppercase">Rensa lista</button>
                    </div>
                    <div id="doneList" class="space-y-2"></div>
                </div>
            </div>

            <div id="statsView" class="hidden">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
                    <table class="w-full excel-table text-sm">
                        <thead class="bg-slate-100 font-black uppercase text-[10px]">
                            <tr><th>Vecka</th><th>Mån</th><th>Tis</th><th>Ons</th><th>Tor</th><th>Fre</th><th>Totalt</th></tr>
                        </thead>
                        <tbody id="weekBody"></tbody>
                    </table>
                    <button onclick="addNewWeekRow()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-black uppercase">+ Ny vecka</button>
                </div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-300 flex shadow-2xl z-50">
            <button onclick="switchTab('Måndag')" id="tab-Måndag" class="nav-tab flex-1 py-5 font-bold text-[11px] uppercase border-r text-slate-500">Mån</button>
            <button onclick="switchTab('Tisdag')" id="tab-Tisdag" class="nav-tab flex-1 py-5 font-bold text-[11px] uppercase border-r text-slate-500">Tis</button>
            <button onclick="switchTab('Onsdag')" id="tab-Onsdag" class="nav-tab flex-1 py-5 font-bold text-[11px] uppercase border-r text-slate-500">Ons</button>
            <button onclick="switchTab('Torsdag')" id="tab-Torsdag" class="nav-tab flex-1 py-5 font-bold text-[11px] uppercase border-r text-slate-500">Tor</button>
            <button onclick="switchTab('Fredag')" id="tab-Fredag" class="nav-tab flex-1 py-5 font-bold text-[11px] uppercase border-r text-slate-500">Fre</button>
            <button onclick="switchTab('Översikt')" id="tab-Översikt" class="nav-tab flex-1 py-5 font-black text-[11px] uppercase text-blue-600 bg-blue-50 italic">Total</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCmVuLp-T9f_XGMmUnWZREK2gi8vvsiYb4",
            authDomain: "lagerlogistik-87feb.firebaseapp.com",
            databaseURL: "https://lagerlogistik-87feb-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lagerlogistik-87feb",
            storageBucket: "lagerlogistik-87feb.firebasestorage.app",
            messagingSenderId: "206906307140",
            appId: "1:206906307140:web:49acbdc1ab3445bc718211"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const trailersRef = ref(db, 'trailers');
        const weeksRef = ref(db, 'weeks');
        let allTrailers = {};
        window.currentDay = 'Måndag';

        // LOGIN LOGIK
        window.checkLogin = () => {
            if(document.getElementById('passInput').value === "Tuglista") {
                localStorage.setItem('logistikLoginTime', Date.now());
                showApp();
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        };

        document.getElementById('passInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') window.checkLogin(); });

        function showApp() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        const lastLogin = localStorage.getItem('logistikLoginTime');
        if (lastLogin && (Date.now() - lastLogin < 3600000)) showApp();

        window.logout = () => { localStorage.removeItem('logistikLoginTime'); location.reload(); };

        // TAB SWITCH
        window.switchTab = (tab) => {
            window.currentDay = tab;
            document.getElementById('dailyView').classList.toggle('hidden', tab === 'Översikt');
            document.getElementById('statsView').classList.toggle('hidden', tab !== 'Översikt');
            renderAll();
        };

        // CREATE
        document.getElementById('addBtn').onclick = () => {
            const nrInput = document.getElementById('trailerNr');
            const portInput = document.getElementById('portNr');
            if (!nrInput.value) return;

            push(trailersRef, {
                nr: nrInput.value, port: portInput.value,
                typ: document.getElementById('typSelect').value,
                avd: document.getElementById('deptSelect').value,
                dag: window.currentDay, status: "Normal", notering: "",
                begart: new Date().toLocaleTimeString('sv-SE', {hour:'2-digit', minute:'2-digit'}),
                klar: false, timestamp: Date.now()
            });

            nrInput.value = ""; portInput.value = ""; nrInput.focus();
        };

        window.updateVal = (id, field, val) => update(ref(db, `trailers/${id}`), { [field]: val });
        window.deleteTrailer = (id) => confirm("Radera?") && remove(ref(db, `trailers/${id}`));
        window.markDone = (id) => {
            const t = allTrailers[id];
            const now = new Date();
            const utTime = now.toLocaleTimeString('sv-SE', {hour:'2-digit', minute:'2-digit'});
            update(ref(db, `trailers/${id}`), { klar: true, utford: utTime });
        };

        onValue(trailersRef, (snapshot) => { allTrailers = snapshot.val() || {}; renderAll(); });

        function renderAll() {
            const activeTable = document.getElementById('activeTable');
            const doneList = document.getElementById('doneList');
            if(!activeTable || !doneList) return;

            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('tab-' + window.currentDay).classList.add('tab-active');

            activeTable.innerHTML = ""; doneList.innerHTML = "";
            let aCount = 0, dCount = 0;

            const sortedIds = Object.keys(allTrailers).sort((a,b) => allTrailers[a].timestamp - allTrailers[b].timestamp);

            sortedIds.forEach(id => {
                const t = allTrailers[id];
                if (t.dag !== window.currentDay) return;

                if (!t.klar) {
                    aCount++;
                    const rowClass = t.status === 'PRIO' ? 'row-prio' : (t.status === 'Hittar ej' ? 'row-problem' : '');
                    activeTable.innerHTML += `
                    <tr class="border-b ${rowClass}">
                        <td class="p-2 sm:p-5">
                            <input type="text" value="${t.nr}" class="font-black trailer-text-mobile sm:text-4xl w-full edit-input" onchange="updateVal('${id}', 'nr', this.value)">
                        </td>
                        <td class="p-2 sm:p-5">
                            <div class="flex flex-col">
                                <input type="text" value="${t.port}" class="font-black port-text-mobile sm:text-2xl text-blue-600 edit-input w-16" onchange="updateVal('${id}', 'port', this.value)">
                                <span class="${t.typ==='In'?'badge-in':t.typ==='Ut'?'badge-ut':'badge-fixa'} w-max mt-1">${t.typ}</span>
                            </div>
                        </td>
                        <td class="p-2 sm:p-5">
                            <span class="bg-slate-100 px-2 py-1 rounded text-[10px] font-black border uppercase">${t.avd}</span>
                        </td>
                        <td class="p-4 hidden md:table-cell">
                            <input type="text" value="${t.notering||''}" onblur="updateVal('${id}', 'notering', this.value)" placeholder="Notering..." class="w-full text-xs italic border-b py-1 outline-none">
                        </td>
                        <td class="p-2 sm:p-5 text-right">
                            <div class="flex items-center justify-end gap-2">
                                <button onclick="markDone('${id}')" class="bg-green-600 text-white font-black px-4 rounded-xl shadow-lg uppercase btn-klar-mobile active:scale-95">KLAR</button>
                                <button onclick="deleteTrailer('${id}')" class="text-slate-200 px-2 text-xl">✕</button>
                            </div>
                        </td>
                    </tr>`;
                } else {
                    dCount++;
                    doneList.innerHTML += `
                    <div class="flex justify-between items-center p-3 bg-white border border-slate-200 rounded-xl shadow-sm">
                        <div class="flex items-center gap-4">
                            <div class="bg-excel-done px-3 py-1 rounded-lg font-black text-xl border border-green-300">${t.nr}</div>
                            <div class="text-[10px] font-bold text-slate-400">P${t.port} - ${t.avd} <span class="text-green-600 ml-2">KLAR ${t.utford}</span></div>
                        </div>
                        <button onclick="updateVal('${id}', 'klar', false)" class="text-slate-300 text-xl">↺</button>
                    </div>`;
                }
            });
            document.getElementById('activeCount').innerText = aCount + " st";
            document.getElementById('doneCount').innerText = dCount;
            document.getElementById('currentTabLabel').innerText = window.currentDay;
        }
    </script>
</body>
</html>
